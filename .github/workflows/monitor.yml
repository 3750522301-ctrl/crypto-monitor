name: 币安异动监控

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install requests pandas numpy

      - name: 跑脚本
        run: python monitor_once.py

      - name: 提交生成文件
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add alerts.json index.html
          git status
          git commit -m "update generated files" || echo "no changes"
          git push
